<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16181c" />
  <meta name="description" content="Peta workflow eksekusi real-time WhatsApp Agent & Antigravity CLI." />
  <title>Agency · Task Map</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f0b74a'/%3E%3Cpath d='M9 22 16 9l7 13M11.8 18h8.4' stroke='%23241a08' stroke-width='2.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./deck.css" />
  <link rel="stylesheet" href="./task-map.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.7 13.7L3 21l4.5-1.2A9 9 0 1 0 12 3Z"/><path d="M9.5 8.8c-.3-.6-.6-.6-.9-.6h-.5c-.3 0-.7.2-.9.6-.3.5-.9 1.2-.9 2.5s1 2.7 1.2 3c.2.3 2 3.1 4.9 4.2 2.4.9 2.9.8 3.4.7.5-.1 1.6-.7 1.8-1.3.2-.6.2-1.1.1-1.3-.1-.1-.4-.2-.8-.4l-2-.9c-.3-.1-.5-.2-.8.2-.2.4-.8 1-.9 1.1-.2.2-.4.2-.7 0-.4-.2-1.4-.5-2.6-1.6-.9-.8-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.4.3-.6 0-.2 0-.4-.1-.6Z"/></symbol>
    <symbol id="i-prompt" viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 3V6Z"/><path d="M8 9h8M8 12h5"/></symbol>
    <symbol id="i-vps" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01M11 7.5h6M11 16.5h6"/></symbol>
    <symbol id="i-agy" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-model" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M3 12h3M18 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="i-acct" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5a7 7 0 0 1 14 0"/></symbol>
    <symbol id="i-ctx" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
    <symbol id="i-mem" viewBox="0 0 24 24"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4H12v15.5l-4.5-1A2.5 2.5 0 0 1 5 16V6.5ZM19 6.5A2.5 2.5 0 0 0 16.5 4H12v15.5l4.5-1a2.5 2.5 0 0 0 2.5-2.5V6.5Z"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-bash" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="m9 9 6 3-6 3V9Z"/></symbol>
    <symbol id="i-git" viewBox="0 0 24 24"><circle cx="6.5" cy="6" r="2.2"/><circle cx="6.5" cy="18" r="2.2"/><circle cx="17.5" cy="9" r="2.2"/><path d="M6.5 8.2v7.6M8.7 6.8l6.6 1.6M6.5 15.8c0-2.8 4-3.5 11-4.6"/></symbol>
    <symbol id="i-media" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="m10 9.5 5 2.5-5 2.5v-5Z"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-step" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5ZM3 13l9 5 9-5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-cli" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m7 10 3 2.5L7 15M12 15h5"/></symbol>
    <symbol id="i-follow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5"/></symbol>
  </svg>

  <header class="bar">
    <a class="brand" href="/" aria-label="Kembali ke Ops Deck">
      <span class="brand-mark">AG</span>
      <span>
        <span class="brand-name">Agency · Task Map</span><br />
        <span class="brand-sub" id="sessionMeta">sesi: memuat…</span>
      </span>
    </a>
    <span class="live-pill ok is-live" id="sseBadge"><span class="live-dot"></span><span>SSE Live</span></span>
    <a class="btn" href="/"><svg class="i"><use href="#i-home"/></svg>Ops Deck</a>
  </header>

  <main class="tm-wrap">
    <div class="tm-rail" id="taskRail" role="region" aria-label="Antrean tugas agen">
      <button type="button" class="tm-tab on"><span class="dot running"></span><span>Memuat tugas…</span></button>
    </div>

    <section class="tm-strip" aria-label="Ringkasan eksekusi tugas">
      <div class="tm-cell"><div class="tm-k"><svg class="i"><use href="#i-prompt"/></svg>Instruksi aktif</div><div class="tm-v tm-prompt" id="mPrompt">--</div></div>
      <div class="tm-cell"><div class="tm-k"><svg class="i"><use href="#i-ctx"/></svg>Status</div><div class="tm-v running" id="mStatus">Memuat</div></div>
      <div class="tm-cell"><div class="tm-k"><svg class="i"><use href="#i-step"/></svg>Langkah</div><div class="tm-v" id="mSteps">0</div></div>
      <div class="tm-cell"><div class="tm-k"><svg class="i"><use href="#i-clock"/></svg>Durasi</div><div class="tm-v" id="mDuration">0s</div></div>
      <div class="tm-cell"><div class="tm-k"><svg class="i"><use href="#i-model"/></svg>Model</div><div class="tm-v" id="mToken">--</div></div>
    </section>

    <section class="tm-board" aria-label="Workflow eksekusi agen">
      <div class="tm-toolbar">
        <div class="tm-legend">
          <span><i class="run"></i>Aktif</span>
          <span><i class="ok"></i>Selesai</span>
          <span><i class="err"></i>Error</span>
          <span><i class="off"></i>Standby</span>
        </div>
        <div class="tm-tools">
          <button type="button" class="follow-btn" id="followBtn" aria-pressed="true"><svg class="i"><use href="#i-follow"/></svg><span>Ikuti Aktif</span></button>
          <div class="seg" role="group" aria-label="Mode tampilan">
            <button type="button" data-view="canvas" aria-pressed="true">Kanvas</button>
            <button type="button" data-view="flow" aria-pressed="false">Alur</button>
          </div>
          <div class="zoom-grp" id="zoomControls">
            <button type="button" id="zOut" aria-label="Perkecil">-</button>
            <button type="button" id="zFit">Fit</button>
            <button type="button" id="zIn" aria-label="Perbesar">+</button>
          </div>
        </div>
      </div>

      <div class="canvas-stage" id="stage" aria-label="Kanvas workflow interaktif; klik node untuk detail">
        <div class="canvas-world" id="world">
          <svg class="edges-svg" id="edgesSvg" viewBox="0 0 1280 640">
            <defs>
              <marker id="arr-idle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1.5 9 5 0 8.5Z" fill="oklch(50% 0.014 250)"/></marker>
              <marker id="arr-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1.5 9 5 0 8.5Z" fill="oklch(75% 0.14 152)"/></marker>
              <marker id="arr-run" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 1.5 9 5 0 8.5Z" fill="oklch(82% 0.15 78)"/></marker>
              <marker id="arr-cool" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1.5 9 5 0 8.5Z" fill="oklch(78% 0.11 240)"/></marker>
              <marker id="arr-err" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1.5 9 5 0 8.5Z" fill="oklch(71% 0.17 25)"/></marker>
            </defs>
            <g id="edgesLayer"></g>
          </svg>
          <div id="nodesLayer"></div>
        </div>
      </div>

      <div class="flow-list" id="flowList" aria-label="Tampilan alur vertikal"></div>
    </section>
  </main>

  <div class="sheet-backdrop" id="backdrop"></div>
  <aside class="inspector" id="inspector" aria-label="Detail node" aria-hidden="true">
    <div class="insp-head">
      <h2 id="inspTitle">Detail Node</h2>
      <button class="btn btn--icon" type="button" id="inspClose" aria-label="Tutup panel"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="insp-body" id="inspBody"></div>
  </aside>

  <script src="./task-map.js" defer></script>
</body>
</html>
