<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Rhteaster — WhatsApp AI Agent, Web Ops Deck, and VPS CLI Toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161b" />
      <stop offset="55%" stop-color="#181b22" />
      <stop offset="100%" stop-color="#121419" />
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0b74a" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Container -->
  <rect width="1280" height="340" rx="16" fill="url(#bg)" />
  <rect width="1280" height="340" rx="16" fill="url(#grid)" />
  <rect x="0.5" y="0.5" width="1279" height="339" rx="15.5" fill="none" stroke="#2c313d" />

  <!-- Top Accent Rule -->
  <rect x="48" y="0" width="360" height="2.5" rx="1.25" fill="url(#amberLine)" />

  <!-- Subtle Right Background Node Mesh -->
  <g stroke="#2a3140" stroke-width="1.2" fill="none" opacity="0.65">
    <path d="M 650 280 L 760 280 L 800 245 L 940 245" />
    <path d="M 760 280 L 810 310 L 1060 310" />
    <circle cx="650" cy="280" r="3.5" fill="#eab308" stroke="none" />
    <circle cx="800" cy="245" r="3.5" fill="#38bdf8" stroke="none" />
    <circle cx="1060" cy="310" r="3.5" fill="#34d399" stroke="none" />
  </g>

  <!-- Left Brand Column -->
  <g transform="translate(56, 54)">
    <!-- Status Badge -->
    <rect x="0" y="0" width="218" height="28" rx="6" fill="#1e222b" stroke="#3a3322" />
    <circle cx="16" cy="14" r="4" fill="#eab308" />
    <text x="29" y="18.5" fill="#f0b74a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.8">CLIENT OPS SUITE · v2.1</text>

    <!-- Title -->
    <text x="0" y="92" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">RHTEASTER</text>

    <!-- Subtitle -->
    <text x="2" y="128" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="500">WhatsApp AI Agent · Web Ops Deck · VPS CLI Toolkit</text>

    <!-- Feature Chips -->
    <g transform="translate(0, 160)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">
      <rect x="0" y="0" width="166" height="32" rx="7" fill="#1d212a" stroke="#2d3442" />
      <circle cx="16" cy="16" r="3.5" fill="#34d399" />
      <text x="28" y="20" fill="#e2e8f0">8-Digit WA Pairing</text>

      <rect x="178" y="0" width="182" height="32" rx="7" fill="#1d212a" stroke="#2d3442" />
      <circle cx="194" cy="16" r="3.5" fill="#38bdf8" />
      <text x="206" y="20" fill="#e2e8f0">SSE Telemetry &amp; Map</text>

      <rect x="372" y="0" width="160" height="32" rx="7" fill="#1d212a" stroke="#2d3442" />
      <circle cx="388" cy="16" r="3.5" fill="#f0b74a" />
      <text x="400" y="20" fill="#e2e8f0">1-Line VPS Setup</text>
    </g>

    <!-- Bottom Caption -->
    <text x="2" y="228" fill="#7f899a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Baileys Multi-Device · Antigravity CLI (agy) · Express SSE · PM2</text>
  </g>

  <!-- Right Terminal Preview Card -->
  <g transform="translate(652, 46)">
    <rect x="0" y="0" width="572" height="236" rx="12" fill="#0f1116" stroke="#2d3340" />
    <rect x="0" y="0" width="572" height="34" rx="12" fill="#171a22" />
    <rect x="0" y="20" width="572" height="14" fill="#171a22" />
    <line x1="0" y1="34" x2="572" y2="34" stroke="#252a35" />

    <!-- Window Dots & Title -->
    <circle cx="18" cy="17" r="5" fill="#ef4444" opacity="0.85" />
    <circle cx="36" cy="17" r="5" fill="#eab308" opacity="0.85" />
    <circle cx="54" cy="17" r="5" fill="#22c55e" opacity="0.85" />
    <text x="76" y="21" fill="#8b95a7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">ssh root@vps — bash</text>

    <!-- Terminal Lines -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      <text x="20" y="64" fill="#f0b74a">$</text>
      <text x="34" y="64" fill="#f1f5f9">curl -sL https://raw.githubusercontent.com/</text>
      <text x="34" y="83" fill="#38bdf8">rhteaster-ui/rhteaster/main/setup.sh | bash</text>

      <text x="20" y="113" fill="#34d399">[OK]</text>
      <text x="58" y="113" fill="#cbd5e1">Node.js v22 LTS + PM2 + agy CLI installed</text>

      <text x="20" y="135" fill="#34d399">[OK]</text>
      <text x="58" y="135" fill="#cbd5e1">Ops Deck online -&gt; http://&lt;VPS_IP&gt;:3000</text>

      <text x="20" y="168" fill="#f0b74a">$</text>
      <text x="34" y="168" fill="#f1f5f9">rhteaster doctor</text>

      <text x="20" y="194" fill="#34d399">[PASS]</text>
      <text x="74" y="194" fill="#e2e8f0">All checks passed · wa-bot &amp; dashboard online</text>

      <rect x="20" y="211" width="8" height="14" rx="1.5" fill="#f0b74a" opacity="0.9" />
    </g>
  </g>
</svg>
